<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goojara Stream</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent native browser scrolling */
            background-color: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Optional: A small overlay to indicate focus if needed */
        .focus-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            font-family: sans-serif;
            font-size: 12px;
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 
      The URL is set directly here. 
      If the site blocks being loaded in an iframe, we handle it in the script below.
    -->
    <iframe id="main-frame" src="https://ww1.goojara.to/watch-trends-genre" allowfullscreen></iframe>
    
    <div class="focus-indicator">Use Arrow Keys to Scroll</div>

    <script>
        // Simple D-Pad support for scrolling within the iframe
        // Since we can't easily read inside the iframe due to cross-origin,
        // we send 'scroll' commands to the iframe window.
        
        const frame = document.getElementById('main-frame');

        document.addEventListener('keydown', function(event) {
            // Check which key was pressed
            switch(event.key) {
                case 'ArrowUp':
                    event.preventDefault();
                    frame.contentWindow.postMessage({ action: 'scroll', direction: -1 }, '*');
                    break;
                case 'ArrowDown':
                    event.preventDefault();
                    frame.contentWindow.postMessage({ action: 'scroll', direction: 1 }, '*');
                    break;
                case 'Enter':
                case 'Select':
                    event.preventDefault();
                    // Send a click or select event to the focused element in the iframe
                    frame.contentWindow.postMessage({ action: 'select' }, '*');
                    break;
                case 'Backspace':
                case 'Escape':
                    // Handle back button if needed
                    history.back();
                    break;
            }
        });

        // Listen for messages from the iframe if Goojara supports them (unlikely, but good practice)
        window.addEventListener('message', function(event) {
            // You can add logic here if Goojara sends specific events
        });

        // Fallback: If the iframe doesn't respond to postMessage, 
        // this ensures the page itself doesn't scroll if the iframe fails to capture focus.
        window.addEventListener('keydown', function(event) {
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
