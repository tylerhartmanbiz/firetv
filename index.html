<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goojara Stream</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* 
           Using a specific proxy service that handles iframes better than others.
           If 'proxifier' fails, you can try 'r.jina.ai' or 'api.allorigins.win' below.
        */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 24px;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- 
      We are using a proxy to bypass the "X-Frame-Options" header.
      The URL is encoded so it doesn't break the iframe src.
    -->
    <iframe id="main-frame" src="https://www.proxifier.org/proxy.php?url=https%3A%2F%2Fww1.goojara.to%2Fwatch-trends-genre" allowfullscreen></iframe>

    <div class="loader" id="loader">Loading...</div>

    <script>
        // Hide loader once the iframe has likely started loading
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
        }, 2000);

        // D-Pad scrolling support
        const frame = document.getElementById('main-frame');

        document.addEventListener('keydown', function(event) {
            switch(event.key) {
                case 'ArrowUp':
                    event.preventDefault();
                    frame.contentWindow.postMessage({ action: 'scroll', direction: -1 }, '*');
                    break;
                case 'ArrowDown':
                    event.preventDefault();
                    frame.contentWindow.postMessage({ action: 'scroll', direction: 1 }, '*');
                    break;
                case 'Enter':
                case 'Select':
                    event.preventDefault();
                    frame.contentWindow.postMessage({ action: 'select' }, '*');
                    break;
                case 'Backspace':
                case 'Escape':
                    history.back();
                    break;
            }
        });
    </script>
</body>
</html>
